{% import "_ui.html" as ui %}
<!-- Закрытие позиции -->
<div class="modal-overlay" id="close-modal">
    <div class="modal" style="max-width: 400px;">
        <div class="modal-head">
            <h2 id="close-modal-title">Закрыть позицию</h2>
            <button type="button" class="icon-btn" data-close-modal title="Закрыть">{{ ui.icon('x') }}</button>
        </div>
        <div class="modal-body">
            <div class="modal-big" id="close-modal-pnl">—</div>
            <div class="modal-detail" id="close-modal-detail"></div>
        </div>
        <div class="modal-foot">
            <button type="button" class="btn" data-close-modal>Отмена</button>
            <button type="button" class="btn btn-danger" id="close-modal-ok" onclick="doClosePos()">Закрыть по рынку</button>
        </div>
    </div>
</div>

<!-- Изменение стопа и тейка -->
<div class="modal-overlay" id="edit-modal">
    <div class="modal" style="max-width: 420px;">
        <div class="modal-head">
            <h2 id="edit-modal-title">Изменить позицию</h2>
            <button type="button" class="icon-btn" data-close-modal title="Закрыть">{{ ui.icon('x') }}</button>
        </div>
        <div class="modal-body">
            <div class="muted num" id="edit-modal-detail" style="font-size: 12.5px;"></div>
            <div class="field">
                <label for="edit-stop">Стоп-лосс, USDT</label>
                <input type="number" id="edit-stop" step="any" min="0">
                <small class="field-hint" id="edit-stop-hint"></small>
            </div>
            <div class="field">
                <label for="edit-target">Тейк-профит, USDT</label>
                <input type="number" id="edit-target" step="any" min="0">
                <small class="field-hint" id="edit-target-hint"></small>
            </div>
        </div>
        <div class="modal-foot">
            <span class="result" id="edit-modal-result"></span>
            <button type="button" class="btn" data-close-modal>Отмена</button>
            <button type="button" class="btn btn-primary" onclick="doEditPos()">Сохранить</button>
        </div>
    </div>
</div>
