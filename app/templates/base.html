<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronos Auto-Trading</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">⚡ Kronos Trading</a>
        <div class="nav-links">
            {% if session %}
            <!-- Переключатель режима Paper / Live -->
            <div class="mode-switcher">
                <button type="button" class="btn btn-xs {% if session.mode.value == 'paper' %}btn-success{% else %}mode-inactive{% endif %}"
                        id="mode-paper" title="Тестовый режим (виртуальные деньги)">📝 Paper</button>
                <button type="button" class="btn btn-xs {% if session.mode.value == 'live' %}btn-danger{% else %}mode-inactive{% endif %}"
                        id="mode-live" title="Реальный режим (настоящие деньги)">💰 Live</button>
            </div>
            <a href="/">Дашборд</a>
            <a href="/analytics">Аналитика</a>
            <a href="/settings">Настройки</a>
            <span class="badge {% if session.mode.value == 'live' %}badge-live{% endif %}">Режим: {{ session.mode.value }}</span>
            <a href="/logout" class="nav-logout" title="Выйти">⏻</a>
            {% else %}
            <a href="/">Дашборд</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}

    <script>
    // Переключатель режима Paper ↔ Live (HTMX POST /api/mode).
    (function() {
        function switchMode(newMode) {
            var fd = new FormData();
            fd.append('mode', newMode);
            fetch('/api/mode', { method: 'POST', body: fd })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.mode) {
                        location.reload();
                    }
                });
        }
        var paperBtn = document.getElementById('mode-paper');
        var liveBtn = document.getElementById('mode-live');
        if (paperBtn) paperBtn.addEventListener('click', function() { switchMode('paper'); });
        if (liveBtn) liveBtn.addEventListener('click', function() { switchMode('live'); });
    })();
    </script>
</body>
</html>
